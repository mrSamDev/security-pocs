<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Protected — NOT framable</title>
<!--
  Same markup as victim.html, but vercel.json attaches:
      X-Frame-Options: DENY
      Content-Security-Policy: frame-ancestors 'none'
  So the browser refuses to render it inside any frame.
-->
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:#eef4ff; color:#1f2a44; }
  .card { width:320px; background:#fff; border:2px solid #2b6cb0; border-radius:12px;
          padding:1.5rem; box-shadow:0 10px 30px rgba(0,0,0,.12); text-align:center; }
  h1 { font-size:1.1rem; margin:0 0 .25rem; }
  .tag { display:inline-block; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
         background:#2b6cb0; color:#fff; border-radius:99px; padding:.15rem .55rem; margin-bottom:1rem; }
  input { width:100%; box-sizing:border-box; font:inherit; padding:.6rem .7rem; margin:.3rem 0;
          border:1px solid #c3d4ef; border-radius:8px; }
  button { width:100%; font:inherit; font-weight:700; padding:.65rem; margin-top:.7rem;
           border:0; border-radius:8px; background:#2b6cb0; color:#fff; cursor:pointer; }
  p { font-size:.8rem; color:#5a6b8c; margin:.9rem 0 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Protected</div>
    <h1>Sign in to Demo Bank</h1>
    <input type="email" placeholder="you@example.com">
    <input type="password" placeholder="Password">
    <button type="button">Sign in</button>
    <p>This page sends <strong>X-Frame-Options: DENY</strong> + <strong>CSP frame-ancestors 'none'</strong> — framing it stays blank.</p>
  </div>
</body>
</html>
