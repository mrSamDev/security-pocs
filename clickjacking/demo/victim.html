<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Victim — intentionally FRAMABLE</title>
<!--
  NOTE: this page deliberately sends NO anti-framing headers.
  It is meant to be framed (that is the whole point of the lab).
  Compare with protected.html, which sets X-Frame-Options + CSP via vercel.json.
-->
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background:#fdf6e3; color:#3b3021; }
  .card { width:320px; background:#fff; border:2px solid #f0b429; border-radius:12px;
          padding:1.5rem; box-shadow:0 10px 30px rgba(0,0,0,.12); text-align:center; }
  h1 { font-size:1.1rem; margin:0 0 .25rem; }
  .tag { display:inline-block; font-size:.7rem; letter-spacing:.06em; text-transform:uppercase;
         background:#f0b429; color:#3b3021; border-radius:99px; padding:.15rem .55rem; margin-bottom:1rem; }
  input { width:100%; box-sizing:border-box; font:inherit; padding:.6rem .7rem; margin:.3rem 0;
          border:1px solid #d8cbb0; border-radius:8px; }
  button { width:100%; font:inherit; font-weight:700; padding:.65rem; margin-top:.7rem;
           border:0; border-radius:8px; background:#2f855a; color:#fff; cursor:pointer; }
  p { font-size:.8rem; color:#7a6f59; margin:.9rem 0 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Framable victim</div>
    <h1>Sign in to Demo Bank</h1>
    <input type="email" placeholder="you@example.com">
    <input type="password" placeholder="Password">
    <button type="button">Sign in</button>
    <p>This page sends <strong>no</strong> anti-framing headers — it can be embedded anywhere.</p>
  </div>
</body>
</html>
